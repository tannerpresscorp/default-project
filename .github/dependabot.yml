version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
  - package-ecosystem: "npm" # pnpm workspace rooted at the repository root
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip" # Django and platform requirements live at the root
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
