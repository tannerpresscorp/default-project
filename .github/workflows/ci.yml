name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node (pnpm workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build

  django:
    name: Django (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python manage.py check
      - run: .venv/bin/python -m pytest

  platform:
    name: Platform foundation (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform_migrator
          POSTGRES_PASSWORD: local_migrator_only
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_migrator -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platform-dev.txt
      - run: python -m pip install -r requirements-platform-dev.txt
      - run: python -m ruff check apps packages tests
      - run: python -m ruff format --check apps packages tests
      - run: python -m mypy
      - run: python -m pytest -c pyproject.toml tests/unit
      - name: Provision isolated test database and runtime role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U platform_migrator -d platform -f - < infra/local/postgres-init.sql
      - name: Migrate test database
        env:
          PLATFORM_MIGRATION_DATABASE_URL: postgresql+asyncpg://platform_migrator:local_migrator_only@127.0.0.1:5432/platform_test
        run: python -m alembic upgrade head
      - name: PostgreSQL isolation integration tests
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+asyncpg://platform_app:local_app_only@127.0.0.1:5432/platform_test
        run: python -m pytest -c pyproject.toml tests/integration
