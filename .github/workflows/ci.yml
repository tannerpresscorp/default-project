name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node (pnpm workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g pnpm@12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build

  helm:
    name: Helm chart (lint and render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        run: |
          curl -sSfL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Default values render nothing
        run: test -z "$(helm template agent-platform infra/helm/agent-platform)"
      - name: Lint gated chart
        run: helm lint --strict infra/helm/agent-platform
      - name: Lint enabled chart
        run: |
          helm lint --strict infra/helm/agent-platform \
            --set global.enabled=true \
            --set api.enabled=true \
            --set worker.enabled=true \
            --set global.image.repository=registry.example/agent-platform \
            --set global.image.tag=sha256-REPLACE \
            --set api.existingSecret=agent-platform-secrets \
            --set worker.existingSecret=agent-platform-secrets \
            --set networkPolicy.ingressNamespace=ingress-nginx \
            --set networkPolicy.database.cidr=10.0.0.0/8 \
            --set networkPolicy.temporal.cidr=10.0.0.0/8 \
            --set podDisruptionBudget.enabled=true
      - name: Lint and render example values
        run: |
          helm lint --strict infra/helm/agent-platform \
            -f infra/helm/agent-platform/values.example.yaml
          helm template agent-platform infra/helm/agent-platform \
            -f infra/helm/agent-platform/values.example.yaml > /dev/null
      - name: Render enabled chart
        run: |
          helm template agent-platform infra/helm/agent-platform \
            --set global.enabled=true \
            --set api.enabled=true \
            --set worker.enabled=true \
            --set global.image.repository=registry.example/agent-platform \
            --set global.image.tag=sha256-REPLACE \
            --set api.existingSecret=agent-platform-secrets \
            --set worker.existingSecret=agent-platform-secrets \
            --set networkPolicy.ingressNamespace=ingress-nginx \
            --set networkPolicy.database.cidr=10.0.0.0/8 \
            --set networkPolicy.temporal.cidr=10.0.0.0/8 \
            --set podDisruptionBudget.enabled=true > /dev/null

  image:
    name: Container image (build and smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned image
        run: docker build -f infra/docker/Dockerfile -t agent-platform:ci .
      - name: Import and non-root smoke tests
        run: |
          docker run --rm --read-only --tmpfs /tmp agent-platform:ci \
            python -c "import apps.api.main"
          test "$(docker run --rm agent-platform:ci id -u)" = "10001"
      - name: Read-only health smoke test
        run: |
          docker run -d --name platform-smoke --read-only --tmpfs /tmp \
            -p 18001:8001 agent-platform:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18001/health/live >/dev/null; then
              docker rm -f platform-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs platform-smoke
          docker rm -f platform-smoke
          exit 1

  django:
    name: Django (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python manage.py check
      - run: .venv/bin/python -m pytest

  platform:
    name: Platform foundation (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform_migrator
          POSTGRES_PASSWORD: local_migrator_only
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_migrator -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platform-dev.txt
      - run: python -m pip install -r requirements-platform-dev.txt
      - run: python -m ruff check apps packages tests
      - run: python -m ruff format --check apps packages tests
      - run: python -m mypy
      - run: python -m pytest -c pyproject.toml tests/unit
      - name: Provision isolated test database and runtime role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U platform_migrator -d platform -f - < infra/local/postgres-init.sql
      - name: Migrate test database
        env:
          PLATFORM_MIGRATION_DATABASE_URL: postgresql+asyncpg://platform_migrator:local_migrator_only@127.0.0.1:5432/platform_test
        run: python -m alembic upgrade head
      - name: Check migrations match models
        env:
          PLATFORM_MIGRATION_DATABASE_URL: postgresql+asyncpg://platform_migrator:local_migrator_only@127.0.0.1:5432/platform_test
        run: python -m alembic check
      - name: Install Temporal CLI for integration tests
        run: |
          curl -sSfL https://github.com/temporalio/cli/releases/download/v1.10.0/temporal_cli_1.10.0_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "TEMPORAL_CLI_PATH=$RUNNER_TEMP/temporal" >> "$GITHUB_ENV"
      - name: PostgreSQL and Temporal integration tests
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+asyncpg://platform_app:local_app_only@127.0.0.1:5432/platform_test
        run: python -m pytest -c pyproject.toml tests/integration
