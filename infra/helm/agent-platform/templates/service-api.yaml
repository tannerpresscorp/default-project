{{- if and .Values.global.enabled .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-platform.fullname" . }}-api
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
{{- end }}
