{{- if and .Values.global.enabled .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-default-deny
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.database.cidr }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.database.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.database.port }}
    {{- end }}
    {{- if .Values.networkPolicy.temporal.cidr }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.temporal.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.temporal.port }}
    {{- end }}
---
{{- if .Values.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-api-ingress
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        {{- else }}
        []
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
{{- end }}
{{- end }}
