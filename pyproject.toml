[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "apps/**/*.py",
    "packages/auth/**/*.py",
    "packages/config/**/*.py",
    "packages/domain/**/*.py",
    "packages/model_clients/**/*.py",
    "packages/observability/**/*.py",
    "packages/persistence/**/*.py",
    "packages/policies/**/*.py",
    "packages/schemas/**/*.py",
    "packages/usage/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
files = [
    "apps/api",
    "apps/eval_service",
    "apps/model_gateway",
    "apps/retrieval",
    "apps/sandbox_manager",
    "apps/tool_gateway",
    "apps/workflow_worker",
    "packages/auth",
    "packages/config",
    "packages/domain",
    "packages/model_clients",
    "packages/observability",
    "packages/persistence",
    "packages/policies",
    "packages/schemas",
    "packages/usage",
]
ignore_missing_imports = true
exclude = ["packages/persistence/migrations/"]
